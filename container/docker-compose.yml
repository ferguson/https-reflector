services:
  https-reflector:
    image: https-reflector:latest
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/https-reflector:/data
      - /var/www/otto.stream:/var/www/public:ro
    env_file:
      - config.env
    # the hub logs one line per proxied request; uncapped this grew to hundreds of MB
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
